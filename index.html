<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirage au sort d'échange de cadeaux 🎅</title>
<style>
/* Début du CSS */
body {
font-family: 'Arial', sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
background-color: #f4f4f9;
color: #333;
text-align: center;
}

.container {
background-color: #fff;
padding: 40px;
border-radius: 10px;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
max-width: 400px;
width: 90%;
}

h1 {
color: #c0392b; /* Rouge de Noël */
margin-bottom: 20px;
}

label {
display: block;
margin-bottom: 10px;
font-weight: bold;
}

input[type="text"] {
padding: 10px;
width: calc(100% - 22px);
margin-bottom: 20px;
border: 2px solid #ccc;
border-radius: 5px;
font-size: 1.2em;
text-align: center;
}

button {
background-color: #2ecc71; /* Vert de Noël */
color: white;
padding: 12px 25px;
border: none;
border-radius: 5px;
cursor: pointer;
font-size: 1em;
transition: background-color 0.3s;
}

button:hover {
background-color: #27ad60;
}

#resultat {
margin-top: 30px;
font-size: 1.5em;
font-weight: bold;
min-height: 30px; /* Pour éviter le saut de mise en page */
}

.receveur {
color: #c0392b; /* Rouge vif pour le nom */
font-size: 1.8em;
margin-top: 10px;
}

/* Nouveau style pour le post-scriptum */
#post-scriptum {
margin-top: 20px;
font-size: 0.8em;
color: #7f8c8d; /* Gris doux pour une note discrète */
max-width: 400px; /* Aligner la largeur avec le conteneur */
width: 90%;
}

/* Style pour le bouton d'envoi d'e-mail */
.email-button {
    display: inline-block;
    background-color: #3498db; /* Bleu pour l'action d'email */
    color: white !important;
    text-decoration: none;
    padding: 10px 20px;
    margin-top: 20px;
    border-radius: 5px;
    font-size: 0.8em;
    font-weight: bold;
    transition: background-color 0.3s;
}

.email-button:hover {
    background-color: #2980b9;
}
/* Fin du CSS */
</style>
</head>
<body>

</div>

function revelerReceveur() {
const code = document.getElementById('codeSaisie').value.trim();
const resultatDiv = document.getElementById('resultat');
resultatDiv.innerHTML = ""; // Réinitialiser le message

// 1. Vérifier si le code existe dans nos associations
const donneur = codesDonneurs[code];

if (donneur) {
// 2. Si le code est valide, trouver le receveur et l'e-mail du donneur
const receveur = tirageSecret[donneur];
const donneurEmail = emailsDonneurs[donneur]; // Récupérer l'e-mail du donneur

// --- Construction du lien mailto: pour l'envoi du nom ---
const emailSubject = encodeURIComponent("Mon Receveur Secret pour l'Échange de Cadeaux ! 🎁");
const emailBody = encodeURIComponent(
    `Bonjour ${donneur},\n\n` +
    `Le tirage au sort est complet !\n` +
    `La personne chanceuse à qui tu offres un cadeau est : ${receveur}.\n\n` +
    `Garde bien le secret ! Tu peux t'envoyer cet e-mail à toi-même pour te le rappeler.\n\n` +
    `Joyeuses Fêtes !`
);
// Le lien inclut l'adresse du donneur dans le champ 'À' (to)
const mailtoLink = `mailto:${donneurEmail}?subject=${emailSubject}&body=${emailBody}`;
// --- Fin Construction du lien mailto: ---


// 3. Afficher le résultat pour le donneur qui a entré le code
resultatDiv.innerHTML = `
<p>Bravo ${donneur} !</p>
<p>La personne chanceuse à qui vous offrez un cadeau est :</p>
<div class="receveur">${receveur}</div>
<p>Chut! C'est un secret ! 😉</p>
<a href="${mailtoLink}" class="email-button" title="Cliquer pour ouvrir votre logiciel de messagerie (Outlook, Gmail, etc.) avec votre adresse préremplie.">
    M'envoyer le nom par Courriel
</a>
`;
} else {
// 4. Message d'erreur si le code est invalide
resultatDiv.innerHTML = `<p style="color: red;">Désolé, ce code n'est pas valide. Veuillez réessayer.</p>`;
}
}
