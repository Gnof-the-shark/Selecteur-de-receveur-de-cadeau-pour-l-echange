/**
 * Fonction utilitaire pour effectuer un fetch avec une nouvelle tentative exponentielle.
 * @param {string} url L'URL de l'API.
 * @param {object} options Les options de l'appel fetch.
 * @param {number} maxRetries Nombre maximal de tentatives.
 * @returns {Promise<Response>} La réponse de l'API.
 */
async function fetchWithExponentialBackoff(url, options, maxRetries = 5) {
    for (let i = 0; i < maxRetries; i++) {
        try {
            const response = await fetch(url, options);
            if (response.status !== 429 && response.ok) {
                return response;
            }
            if (response.status === 429 && i < maxRetries - 1) {
                // Si 429 (Too Many Requests), attendre et réessayer
                const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));
            } else {
                throw new Error(`API response error: ${response.statusText}`);
            }
        } catch (error) {
            if (i === maxRetries - 1) throw error;
            const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
            await new Promise(resolve => setTimeout(resolve, delay));
        }
    }
}

window.revelerReceveur = function() {

/**
 * Fonction pour générer des idées cadeaux en utilisant l'API Gemini.
 * Intègre les informations supplémentaires saisies par l'utilisateur dans le prompt.
 */
window.genererIdeeCadeau = async function() {
    if (!receveurActuel) {
        console.warn("Veuillez d'abord révéler le receveur.");
        return;
    }

    const ideeCadeauDiv = document.getElementById('ideeCadeauResultat');
    const infoSuppTextarea = document.getElementById('infoSupp');
    // La vérification que l'élément infoSuppTextarea existe est maintenant nécessaire
    const infoSupplementaire = infoSuppTextarea ? infoSuppTextarea.value.trim() : "";

    ideeCadeauDiv.innerHTML = `<div class="loading"></div> Réflexion en cours pour ${receveurActuel}...`;

    let userContext = "";
    if (infoSupplementaire) {
        userContext = `"${infoSupplementaire}".`;
    }

    const systemPrompt = "You are a creative and festive Secret Santa gift expert. Your goal is to suggest 3 thoughtful, fun, and appropriate gift ideas (under 50 EUR/USD) for a specific person in a family/friends exchange. Respond only with the 3 numbered gift ideas and a brief, encouraging introduction. The response must be in French. Do not include price estimates or dollar signs. Use line breaks for readability.";
    
    // Construction de la requête Gemini avec le contexte utilisateur
    const userQuery = `Suggest 3 creative and thoughtful Secret Santa gift ideas for the recipient named ${receveurActuel}. Suggest ideas on the theme: Fais-moi découvrir(activités(lecture, programation, art, etc) ou sortie). It could be for example: tricot, programmation, lecture, etc. Idea could be unnusual. We are in Quebec. Maximum 30$.Puisque le thème est fait moi découvrir, prend en compte que la personne aime ${userContext} pour ne pas suggérer des cadeaux sur ce/ces sujets. Quelque chose de simple à trouver et qui ne prend pas beaucoup de temps à faire et qui ne coute pas cher(max 30$).`;

    const payload = {
        contents: [{ parts: [{ text: userQuery }] }],
        systemInstruction: {
            parts: [{ text: systemPrompt }]
        },
    };

    try {
        const response = await fetchWithExponentialBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text || "Désolé, je n'ai pas pu générer d'idées pour le moment. Réessayez.";

        const htmlContent = generatedText.replace(/\n/g, '<br>');

        ideeCadeauDiv.innerHTML = `
            <p style="font-weight: bold; color: #e67e22;">✨ Idées Cadeaux pour ${receveurActuel} :</p>
            <p>${htmlContent}</p>
        `;
    } catch (error) {
        console.error("Erreur lors de l'appel à l'API Gemini:", error);
        ideeCadeauDiv.innerHTML = `<p style="color: red;">Erreur lors de la génération des idées. Vérifiez la console pour les détails.</p>`;
    }
}
